[project]
name = "mon3tr"
version = "0.1.0"
description = "Discord bot with osu! mapping & modding utilities"
authors = [
    {name = "namakemono-san",email = "me@yuzunix.dev"}
]
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "discord-py (>=2.6.4,<3.0.0)",
    "jishaku (>=2.6.3,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "aiohttp (>=3.9.0,<4.0.0)",
    "aiosqlite (>=0.20.0)",
    "yt-dlp (>=2025.1.1)",
    "boto3 (>=1.35.0)",
    "numpy (>=2.5.2,<3.0.0)"
]

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 100
target-version = "py313"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
